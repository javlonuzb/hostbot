name: test

on:
  push:
  pull_request:
  workflow_dispatch:        # Actions -> test -> Run workflow
  schedule:
    - cron: "0 */6 * * *"   # har 6 soatda qayta ishga tushadi

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  run-bot:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: run-hostbot
      cancel-in-progress: false
    env:
      MASTER_BOT_TOKEN: ${{ secrets.MASTER_BOT_TOKEN }}
      ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
      MAX_RUNTIME_MIN: "340"
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ma'lumotlarni tiklash
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            !data/bots/*/libs
          key: hostdata-${{ github.run_id }}
          restore-keys: hostdata-

      - name: Hosting botni ishga tushirish
        run: python main.py

      - name: Ma'lumotlarni saqlash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            !data/bots/*/libs
          key: hostdata-${{ github.run_id }}
