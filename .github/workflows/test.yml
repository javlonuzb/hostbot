name: host-bot-v2

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring, pdo_sqlite, sqlite3
          tools: composer
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v

  run-bot:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: run-hostbot
      cancel-in-progress: false
    env:
      MAX_RUNTIME_MIN: "340"
      DATA_DIR: data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring, pdo_sqlite, sqlite3
          tools: composer
      - run: pip install -r requirements.txt
      # No Actions cache for hosting.db or bot data. Only pip's download cache is used.
      # main.py discovers the last pinned Telegram ZIP via BACKUP_CHANNEL_ID before autostart.
      - name: Telegramdan tiklash va hostingni ishga tushirish
        env:
          MASTER_BOT_TOKEN: ${{ secrets.MASTER_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BACKUP_CHANNEL_ID: ${{ secrets.BACKUP_CHANNEL_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MODELS: ${{ vars.AI_MODELS }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          PUBLIC_ACCESS: ${{ vars.PUBLIC_ACCESS || 'false' }}
          MAX_BOTS: ${{ vars.MAX_BOTS || '3' }}
          AI_DAILY: ${{ vars.AI_DAILY || '25' }}
        run: python main.py
